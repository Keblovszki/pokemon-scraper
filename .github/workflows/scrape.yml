name: Scrape butikker

# Kun dispatch. GitHubs "schedule" blev prøvet og fyrede ikke en eneste gang
# på to en halv time — planlagte kørsler bliver droppet når der er pres på de
# delte runnere. Worker'ens cron kalder i stedet dispatch-API'et hvert 5.
# minut, og den starter med det samme. På kvartererne uden "shop", så alle
# butikker scrapes; imellem dem med én butik, der er let nok til at tåle det.
on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Butiks-id der scrapes alene (tom = alle butikker)"
        required: false
        default: ""
        type: string

run-name: "Scrape ${{ inputs.shop || 'alle butikker' }}"

# To kørsler ad gangen ville sende to snapshots oven i hinanden, og så kan den
# ene melde restock på noget den anden allerede har meldt.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Installér afhængigheder
        working-directory: scraper
        run: npm ci

      # Runneren har normalt både Google Chrome og xvfb, og det er forskellen
      # mellem en kørsel på et halvt minut og en på tre. Vi installerer kun det
      # der mangler, så workflowet også holder hvis billedet ændrer sig.
      #
      # Det skal være rigtig Chrome, ikke Playwrights Chromium: det er den
      # kombination der er afprøvet mod Proshop.
      - name: Sikr Chrome og xvfb
        working-directory: scraper
        run: |
          if ! command -v google-chrome >/dev/null; then
            echo "Chrome mangler, installerer"
            npx playwright install chrome --with-deps
          fi
          if ! command -v xvfb-run >/dev/null; then
            echo "xvfb mangler, installerer"
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          google-chrome --version

      # Proshop afviser headless, så Chrome skal have et rigtigt vindue. xvfb
      # giver den en skærm der ikke findes.
      - name: Scrape og send snapshot
        working-directory: scraper
        run: xvfb-run -a npm run once -- ${SHOP:+--shop=$SHOP}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SHOP: ${{ inputs.shop }}
