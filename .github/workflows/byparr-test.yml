name: Byparr-test mod Proshop

# Engangstest: kommer Byparr forbi Proshops bot-beskyttelse fra GitHubs
# runnere? Containeren genstartes før hvert forsøg, så ingen cookie fra et
# tidligere forsøg hjælper det næste — det svarer til en frisk scrape-kørsel.
on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Antal forsøg"
        required: false
        default: "10"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Start Byparr
        run: |
          docker run -d --name byparr -p 8191:8191 ghcr.io/thephaseless/byparr:latest
          for i in $(seq 1 60); do curl -sf localhost:8191/health && break; sleep 5; done

      - name: Prøv Proshop
        env:
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          ok=0
          for i in $(seq 1 "$ATTEMPTS"); do
            docker restart byparr > /dev/null
            for w in $(seq 1 60); do curl -sf localhost:8191/health > /dev/null && break; sleep 2; done

            curl -s -m 120 localhost:8191/v1 -H 'Content-Type: application/json' \
              -d '{"cmd":"request.get","url":"https://www.proshop.dk/pokemon-kort?ps=100&pn=1","maxTimeout":90000}' \
              > out.json || true
            items=$(jq -r '.solution.response // ""' out.json | grep -o 'site-productlist-item' | wc -l)
            title=$(jq -r '.solution.response // ""' out.json | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')

            if [ "$items" -gt 0 ]; then ok=$((ok+1)); echo "Forsøg $i: OK ($items varer)"
            else echo "Forsøg $i: FEJL — titel: ${title:-ingen} — $(jq -c '{status, message}' out.json 2>/dev/null || head -c 200 out.json)"; fi

            sleep 30
          done
          echo "### Byparr: $ok ud af $ATTEMPTS kom igennem" | tee -a "$GITHUB_STEP_SUMMARY"
