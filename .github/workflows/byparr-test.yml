name: Byparr-test mod Proshop

# Engangstest: kommer Byparr forbi Proshops bot-beskyttelse fra GitHubs
# runnere? Containeren startes forfra før hvert forsøg, så ingen cookie fra et
# tidligere forsøg hjælper det næste — det svarer til en frisk scrape-kørsel.
on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "Antal forsøg"
        required: false
        default: "10"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Start Byparr
        run: |
          docker run -d --name byparr -p 8191:8191 ghcr.io/thephaseless/byparr:latest
          for i in $(seq 1 60); do curl -sf localhost:8191/health && break; sleep 5; done

      - name: Prøv Proshop
        env:
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          ok=0
          for i in $(seq 1 "$ATTEMPTS"); do
            # En genstart kan hænge, så containeren smides helt væk i stedet.
            docker rm -f byparr > /dev/null
            docker run -d --name byparr -p 8191:8191 ghcr.io/thephaseless/byparr:latest > /dev/null
            for w in $(seq 1 60); do curl -sf localhost:8191/health > /dev/null && break; sleep 2; done

            start=$(date +%s)
            : > out.json
            timeout 150 curl -s -m 140 localhost:8191/v1 -H 'Content-Type: application/json' \
              -d '{"cmd":"request.get","url":"https://www.proshop.dk/pokemon-kort?ps=100&pn=1","maxTimeout":120000}' \
              > out.json || true
            took=$(( $(date +%s) - start ))
            items=$(jq -r '.solution.response // ""' out.json 2>/dev/null | grep -o 'site-productlist-item' | wc -l)
            title=$(jq -r '.solution.response // ""' out.json 2>/dev/null | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')

            if [ "$items" -gt 0 ]; then ok=$((ok+1)); echo "Forsøg $i: OK ($items varer, ${took}s)"
            else
              echo "Forsøg $i: FEJL efter ${took}s — titel: ${title:-ingen} — svar: $(head -c 300 out.json)"
              docker logs --tail 15 byparr 2>&1 | sed 's/^/    /'
            fi

            sleep 30
          done
          echo "### Byparr: $ok ud af $ATTEMPTS kom igennem" | tee -a "$GITHUB_STEP_SUMMARY"
